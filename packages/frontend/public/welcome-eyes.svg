<!-- 完整静态 IP 占位复用毛绒眼形、眼距及原画色阶；与身体图片同时展示，坐标对应 240×240 画布。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <radialGradient id="eye" cx="65%" cy="25%" r="90%">
      <stop stop-color="#65514a" />
      <stop offset=".45" stop-color="#3b2e2a" />
      <stop offset="1" stop-color="#211b19" />
    </radialGradient>
  </defs>
  <ellipse cx="91" cy="104" rx="12.5" ry="20.625" fill="url(#eye)" />
  <ellipse cx="149" cy="104" rx="12.5" ry="20.625" fill="url(#eye)" />
  <ellipse
    cx="92"
    cy="100"
    rx="3.4"
    ry="4.2"
    fill="white"
    transform="rotate(-15 92 100)"
  />
  <ellipse
    cx="150"
    cy="100"
    rx="3.4"
    ry="4.2"
    fill="white"
    transform="rotate(-15 150 100)"
  />
</svg>
