<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">NeuxBot 项目目标架构</title><desc id="desc">逻辑架构提案。入口连接工作编排与能力管理；工作编排使用能力供给并发起 Agent 执行；执行经授权调用能力和业务工具。各领域通过基础支撑持有自己的数据。当前在本机装配，未来可改变部署形态。</desc>
