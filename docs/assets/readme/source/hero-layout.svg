<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NeuxBot — your AI partners, working together</title>
  <desc id="desc">Product concept: persistent AI partners collaborate on a goal and deliver research, code changes and reports in a local-first workspace.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="1200" height="720" rx="28" fill="#f8f8f9"/>

    <g id="brand"><svg x="52" y="42" width="44" height="44" viewBox="0 0 320 320">
  <title>NeuxBot</title>
  <g transform="translate(20 42)">
    <path fill="#1c1c1c" d="M24 0h51c13 0 22 4 31 13l68 68c9 9 11 15 11 27v60h-18c-8 0-13-2-19-8L76 88c-3-3-4-2-4 2v69c0 9-2 14-8 20l-24 24c-4 4-8 6-15 6H8c-5 0-8-3-8-8V24C0 10 10 0 24 0Z"/>
    <path fill="#24da36" d="m76 88 73 73c5 5 10 7 18 7h30c7 0 9-2 9-8V85c0-9 2-13 8-19l26-26c5-5 9-6 17-6h14c6 0 9 3 9 9v171c0 14-8 22-22 22h-54c-14 0-23-4-33-14l-59-66c-14-16-25-42-36-68Z"/>
  </g>
</svg>
<text x="108" y="75" font-size="30" font-weight="700" fill="#1c1c1f" >NeuxBot</text></g>
    <g id="promise">
      <text x="56" y="186" font-size="64" font-weight="700" fill="#1c1c1f" letter-spacing="-2">Your AI partners.</text>
      <text x="56" y="262" font-size="64" font-weight="700" fill="#1c1c1f" letter-spacing="-2">Working together.</text>
      <text x="58" y="319" font-size="26" font-weight="400" fill="#6a6a6a" >A local-first workspace for real work.</text>
    </g>
    <g id="partners">
      <ellipse cx="886" cy="373" rx="228" ry="43" fill="#ededf0"/>
      <image href="partner-research.png" x="617" y="158" width="260" height="260"/>
      <image href="partner-build.png" x="887" y="151" width="260" height="260"/>
      <image href="partner-lead.png" x="716" y="83" width="340" height="340"/>
    </g>
    <g id="goal">
      <rect x="56" y="380" width="1088" height="78" rx="20" fill="#1c1c1f"/>
      <circle cx="91" cy="419" r="8" fill="#24da36"/>
      <text x="116" y="428" font-size="28" font-weight="500" fill="#fff" >Plan the release. Build it. Review the result.</text>
      <path d="M1080 407l12 12-12 12m-13-12h24" fill="none" stroke="#24da36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="work-and-deliverables">
      <rect x="56" y="482" width="348" height="182" rx="20" fill="#fff"/>
      <rect x="422" y="482" width="348" height="182" rx="20" fill="#fff"/>
      <rect x="788" y="482" width="356" height="182" rx="20" fill="#fff"/>
      <text x="80" y="523" font-size="18" font-weight="700" fill="#087f73" letter-spacing="1.5">RESEARCH</text>
      <text x="80" y="562" font-size="28" font-weight="600" fill="#1c1c1f" >Knowledge → brief</text>
      <path d="M82 593h166m-166 14h207m-207 14h135" stroke="#dedee3" stroke-width="5" stroke-linecap="round"/>
      <text x="446" y="523" font-size="18" font-weight="700" fill="#a54815" letter-spacing="1.5">BUILD</text>
      <text x="446" y="562" font-size="28" font-weight="600" fill="#1c1c1f" >Project → changes</text>
      <rect x="446" y="585" width="118" height="39" rx="8" fill="#eaf7ee"/>
      <text x="461" y="612" font-size="20" font-weight="600" fill="#217346" >+ src/app</text>
      <text x="812" y="523" font-size="18" font-weight="700" fill="#7047a3" letter-spacing="1.5">REVIEW</text>
      <text x="812" y="562" font-size="28" font-weight="600" fill="#1c1c1f" >Results → next step</text>
      <path d="M815 603l7 7 14-16" fill="none" stroke="#7047a3" stroke-width="3" stroke-linecap="round"/>
      <text x="850" y="611" font-size="21" font-weight="400" fill="#6a6a6a" >Ready for your review</text>
    </g>

  </g>
</svg>